name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: python -m pip install -r requirements-build.txt
      - run: pnpm --dir services/lux install --frozen-lockfile
      - run: pnpm --dir services/netgear install --frozen-lockfile
      - run: python -m unittest discover -s services/dsan -p "test_*.py"
      - run: node --test tests/*.test.cjs services/lux/tests/fetch-signal-snapshot.test.mjs services/ultrix/test/*.test.js services/netgear/test/*.test.mjs
      - run: go -C services/power test ./...
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - run: node scripts/smoke-bundle.cjs "dist/windows/Tech Hub/resources"
      - run: ./scripts/test-windows-host.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Tech-Hub-Windows-x64-Setup.exe
            dist/Tech-Hub-Windows-x64-Setup.exe.sha256
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: python -m pip install -r requirements-build.txt
      - run: pnpm --dir services/lux install --frozen-lockfile
      - run: pnpm --dir services/netgear install --frozen-lockfile
      - run: python -m unittest discover -s services/dsan -p "test_*.py"
      - run: node --test tests/*.test.cjs services/lux/tests/fetch-signal-snapshot.test.mjs services/ultrix/test/*.test.js services/netgear/test/*.test.mjs
      - run: go -C services/power test ./...
      - run: bash scripts/build-mac.sh
      - run: node scripts/smoke-bundle.cjs "dist/Tech Hub.app/Contents/Resources"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            dist/Tech-Hub-macOS-arm64.dmg
            dist/Tech-Hub-macOS-arm64.dmg.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers together
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --title "Tech Hub ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md --verify-tag
