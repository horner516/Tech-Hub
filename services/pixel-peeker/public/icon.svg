<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pixel Peeker">
  <rect width="32" height="32" rx="6" fill="#0e1116"/>
  <g id="mark">
    <!-- A wall of cabinets with one picked out: the tile you are peeking at. -->
    <g fill="#2f9ee0" opacity=".42">
      <rect x="5" y="8" width="6.6" height="5" rx=".8"/>
      <rect x="12.7" y="8" width="6.6" height="5" rx=".8"/>
      <rect x="20.4" y="8" width="6.6" height="5" rx=".8"/>
      <rect x="5" y="14" width="6.6" height="5" rx=".8"/>
      <rect x="20.4" y="14" width="6.6" height="5" rx=".8"/>
      <rect x="5" y="20" width="6.6" height="5" rx=".8"/>
      <rect x="12.7" y="20" width="6.6" height="5" rx=".8"/>
      <rect x="20.4" y="20" width="6.6" height="5" rx=".8"/>
    </g>
    <rect x="12.7" y="14" width="6.6" height="5" rx=".8" fill="#2f9ee0"/>
  </g>
</svg>
