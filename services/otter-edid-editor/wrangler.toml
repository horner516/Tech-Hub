# Cloudflare deployment for Otter EDID Editor.
#
# A static-assets-only Worker: no server code, same shape as blend-calc and
# test-card. Cloudflare runs the Vite build, so dist/ stays out of git. Set the
# build command in the Cloudflare project to:
#
#   npm ci && npm run build
#
# public/_headers is copied into dist/ by Vite and carries the CSP; the assets
# runtime honours it. `npm run preview` does NOT apply it — use
# `npm run serve:dist` to test the CSP for real.

name = "otter-edid-editor"
compatibility_date = "2026-08-20"

[assets]
directory = "./dist"

[[routes]]
pattern = "otter-edid.stoatworks-labs.com"
custom_domain = true
