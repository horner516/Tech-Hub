<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otter EDID Editor</title>
    <meta name="description" content="Build, edit and check EDIDs in the browser — nothing is uploaded." />
      <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Tints the status bar when installed. Two, so it follows the theme. -->
    <meta name="theme-color" content="#12151a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12151a" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="Otter EDID Editor"
      data-repo="https://github.com/stoatworks-labs/otter-edid-editor"
      data-note="It runs entirely in your browser — no account, and no EDID of yours is uploaded."
    ></script>
  </body>
</html>
